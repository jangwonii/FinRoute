services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finroute-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finroute}
      POSTGRES_USER: ${POSTGRES_USER:-finroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finroute}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finroute-postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finroute} -d ${POSTGRES_DB:-finroute}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finroute-postgres-data:
